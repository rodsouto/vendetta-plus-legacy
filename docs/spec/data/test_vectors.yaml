  _note: "Legacy quirks preserved: dollar production can be fractional or negative; when bar is satisfied from stock but brewery output < bar consumption, alcohol production goes negative and smuggle is fed getProduccionByConsumo(<negative prodAlcohol>); smuggle starvation uses prodAlcohol, not stock. alcohol_stock 0 is treated as \"no stock\" (!empty check)."
