  _formula: "attack = floor((1 + sqrt(sum of levels of attack_research)/10) * base_attack); defense = floor((1 + sqrt(sum levels of defense_research)/10) * defense_raw) (defense_base == defense_raw, no multiplier); speed = round(base_speed*(1+sqrt(level speed_research)/10)); capacity = round(base_capacity*(1+sqrt(level enhanced_cargo_capacity)/10)). A research listed twice would count twice in the sum (no Space4k troop lists one twice)."
