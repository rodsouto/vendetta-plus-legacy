  _note: "Same legacy algorithm as Vendetta with Space4k rooms (Mob_Server::getNameHabRecurso): iron_mine->iron, lutinum_refinery->lutinum, drilling_rig->water, chemical_plant (bar slot) and enhanced_chemical_plant (smuggle slot) consume water to produce hydrogen. Quirks preserved: hydrogen production can be fractional or negative; when chemical_plant is satisfied from stock but drilling_rig output < its consumption, water production goes negative and enhanced_chemical_plant is fed getProduccionByConsumo(<negative prodAlcohol>); enhanced_chemical_plant starvation uses water production, not stock. water_stock 0 is treated as \"no stock\" (!empty check)."
