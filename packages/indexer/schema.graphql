# Market history (B-11, B-18): trades keep every offer, acceptance, payment and withdrawal,
# cancelled ones included (the contract deletes those). Battle reports (B-18): the inputs and totals
# of every combat, read by the web app. The ranking is not here: the client computes it from the
# world it loads (B-18).

type Player @entity(immutable: false) {
  "Player id (decimal)"
  id: ID!
  "Accepted trades paid in full, as seller or buyer"
  completedTrades: Int!
  tradesAsSeller: [Trade!]! @derivedFrom(field: "seller")
  tradesAsBuyer: [Trade!]! @derivedFrom(field: "buyer")
  battlesAsAttacker: [Battle!]! @derivedFrom(field: "attacker")
  battlesAsDefender: [Battle!]! @derivedFrom(field: "defender")
}

enum TradeStatus {
  "Offered, not accepted yet"
  PENDING
  "Accepted: the goods and the deposit are held, payments arrive until closesAt (D-19)"
  ACCEPTED
  "A pending offer withdrawn by either party"
  CANCELLED
}

type Trade @entity(immutable: false) {
  "Trade id (decimal)"
  id: ID!
  seller: Player!
  buyer: Player!
  status: TradeStatus!
  "The seller's building the goods leave at acceptance"
  from: BigInt!
  "Resource index sold (ruleset order)"
  sold: Int!
  quantity: BigInt!
  "Price per resource index"
  price: [BigInt!]!
  "Values of the exchange rate the price matched, per resource index (B-11)"
  rate: [BigInt!]!
  offeredAt: BigInt!
  acceptedAt: BigInt
  "The window end: a trade not paid in full by then ends unpaid or partly paid (D-19)"
  closesAt: BigInt
  "The buyer's deposit held at acceptance, per resource index"
  deposit: [BigInt!]!
  "Price paid so far, per resource index"
  paid: [BigInt!]!
  "Paid in full: final before the window closed"
  complete: Boolean!
  payments: [Payment!]! @derivedFrom(field: "trade")
  withdrawals: [Withdrawal!]! @derivedFrom(field: "trade")
}

type Payment @entity(immutable: true) {
  "<transaction hash>-<log index>"
  id: ID!
  trade: Trade!
  "What this transport counted, per resource index"
  amount: [BigInt!]!
  "Price paid after it, per resource index"
  paid: [BigInt!]!
  timestamp: BigInt!
  block: BigInt!
}

type Withdrawal @entity(immutable: true) {
  "<transaction hash>-<log index>"
  id: ID!
  trade: Trade!
  player: Player!
  "Moved into one of the player's buildings, per resource index"
  amount: [BigInt!]!
  timestamp: BigInt!
  block: BigInt!
}

"""
A battle report (B-18): the event's inputs and totals. Combat is deterministic, so the client
recomputes the rounds from them with the rules engine.
"""
type Battle @entity(immutable: true) {
  "<transaction hash>-<log index>"
  id: ID!
  mission: BigInt!
  attacker: Player!
  defender: Player!
  "The building fought over"
  building: BigInt!
  "Troops per troop index (ruleset order)"
  attackerArmy: [BigInt!]!
  defenderArmy: [BigInt!]!
  "Research levels per research index"
  attackerResearch: [Int!]!
  defenderResearch: [Int!]!
  "Honor percentages (06-combat.md#honor)"
  attackerPct: BigInt!
  defenderPct: BigInt!
  attackerSurvivors: [BigInt!]!
  defenderSurvivors: [BigInt!]!
  "Taken by the attacker, per resource index"
  loot: [BigInt!]!
  timestamp: BigInt!
  block: BigInt!
  logIndex: Int!
  """
  block × 2^32 + logIndex: the chain order in one sortable value. A query orders and limits by one
  field, and ties on block would be broken by id, which is not the order of the events.
  """
  position: BigInt!
}
