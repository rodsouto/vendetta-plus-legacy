# Market history (B-11, B-18): trades keep every offer, acceptance, delivery, claim and debt,
# cancelled ones included (the contract deletes those). The ranking is not here: the client computes
# it from the world it loads (B-18).

type Player @entity(immutable: false) {
  "Player id (decimal)"
  id: ID!
  "Accepted trades fully delivered and fully paid, as seller or buyer"
  completedTrades: Int!
  "Debts registered against this player (a creditor claimed), ever (B-11)"
  defaults: Int!
  "Registered debts not yet paid back: the on-chain Player.debts (B-11)"
  openDebts: Int!
  tradesAsSeller: [Trade!]! @derivedFrom(field: "seller")
  tradesAsBuyer: [Trade!]! @derivedFrom(field: "buyer")
}

enum TradeStatus {
  "Offered, not accepted yet"
  PENDING
  "Accepted: the delivery window runs from acceptedAt (D-19)"
  ACCEPTED
  "A pending offer withdrawn by either party"
  CANCELLED
}

type Trade @entity(immutable: false) {
  "Trade id (decimal)"
  id: ID!
  seller: Player!
  buyer: Player!
  status: TradeStatus!
  "Resource index sold (ruleset order)"
  sold: Int!
  quantity: BigInt!
  "Price per resource index"
  price: [BigInt!]!
  "Index of the exchange rate the price matched: values a default (B-11)"
  rate: Int!
  offeredAt: BigInt!
  "When the buyer accepted; the window closes delivery_window_days later"
  acceptedAt: BigInt
  "Sold resource delivered inside the window"
  delivered: BigInt!
  "Price paid inside the window, per resource index"
  paid: [BigInt!]!
  "Restitution received by the creditor after the window, per resource index"
  returned: [BigInt!]!
  "Fully delivered and fully paid"
  complete: Boolean!
  "The creditor claimed once: the debt counts against the debtor (B-11)"
  registered: Boolean!
  debtor: Player
  creditor: Player
  "The registered debt was fully returned"
  debtPaid: Boolean!
  claims: [Claim!]! @derivedFrom(field: "trade")
}

type Claim @entity(immutable: true) {
  "<transaction hash>-<log index>"
  id: ID!
  trade: Trade!
  "Collected from the debtor, per resource index"
  amount: [BigInt!]!
  timestamp: BigInt!
  block: BigInt!
}
