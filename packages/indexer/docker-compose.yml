# Local graph-node for development and e2e (scripts/local.sh). State lives in tmpfs: every run
# starts empty, like the anvil it indexes.
services:
  graph-node:
    image: graphprotocol/graph-node:v0.45.0
    ports:
      - "127.0.0.1:${GRAPH_PORT}:8000"
      - "127.0.0.1:${ADMIN_PORT}:8020"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [ipfs, postgres]
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: graph-node
      postgres_db: graph-node
      ipfs: ipfs:5001
      ethereum: anvil:http://host.docker.internal:${RPC_PORT}
      ETHEREUM_POLLING_INTERVAL: "500"
      GRAPH_LOG: warn
  ipfs:
    image: ipfs/kubo:v0.38.0
    ports:
      - "127.0.0.1:${IPFS_PORT}:5001"
    tmpfs: [/data/ipfs]
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements", "-cmax_connections=200"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: graph-node
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    tmpfs: [/var/lib/postgresql/data]
