specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Game
    network: {{network}}
    source:
      abi: IGameEvents
      address: "{{address}}"
      startBlock: {{startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Player
        - Trade
        - Claim
      abis:
        - name: IGameEvents
          file: ../../contracts/out/GameErrors.sol/IGameEvents.json
      eventHandlers:
        # Market (B-11). uint64[4] is one entry per resource (RESOURCES in the generated ruleset).
        - event: TradeOffered(indexed uint64,indexed uint64,indexed uint64,uint8,uint64,uint64[4],uint8)
          handler: handleTradeOffered
        - event: TradeAccepted(indexed uint64)
          handler: handleTradeAccepted
        - event: TradeCancelled(indexed uint64)
          handler: handleTradeCancelled
        - event: TradeSettled(indexed uint64,uint64,uint64[4],uint64[4])
          handler: handleTradeSettled
        - event: TradeClaimed(indexed uint64,uint64[4])
          handler: handleTradeClaimed
        - event: DebtRegistered(indexed uint64,indexed uint64,indexed uint64)
          handler: handleDebtRegistered
        - event: DebtPaid(indexed uint64)
          handler: handleDebtPaid
      file: ./src/mapping.ts
