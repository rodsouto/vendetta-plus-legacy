specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Game
    network: {{network}}
    source:
      abi: IGameEvents
      address: "{{address}}"
      startBlock: {{startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Player
        - Trade
        - Payment
        - Withdrawal
      abis:
        - name: IGameEvents
          file: ../../contracts/out/GameErrors.sol/IGameEvents.json
      eventHandlers:
        # Market (B-11). uint64[4] is one entry per resource (RESOURCES in the generated ruleset).
        - event: TradeOffered(indexed uint64,indexed uint64,indexed uint64,uint64,uint8,uint64,uint64[4],uint64[4])
          handler: handleTradeOffered
        - event: TradeAccepted(indexed uint64,uint40,uint64[4])
          handler: handleTradeAccepted
        - event: TradeCancelled(indexed uint64)
          handler: handleTradeCancelled
        - event: TradePaid(indexed uint64,uint64[4])
          handler: handleTradePaid
        - event: TradeWithdrawn(indexed uint64,indexed uint64,uint64[4])
          handler: handleTradeWithdrawn
      file: ./src/mapping.ts
