  <body>
    <!--
      THESIS: Vendetta is the family's account book: every building is an account, every room,
      research, batch and mission a dated entry, and the balance is always live. It refuses the
      category's dashboard of dark panels, icon cards and progress bars.
      OWN-WORLD: dark leather binding (#24201F) holding parchment pages (#FFFCDB / #E7E4C3 / #E0DDCA)
      ruled in khaki (#A6A18B), black ink for entries, red ink (#AF0000 / #6E0000) for losses,
      shortfalls and hostile marks, ledger-blue (#084B8A) for references; Bodoni headings, Archivo
      tabular figures, rubber stamps as the only state marker, a thumb index on the fore edge.
      STORY: a player opens the book between other things, reads the balance and what lands next,
      writes the next entries (queue, train, send) and closes it in under a minute.
      FIRST VIEWPORT: the account page of the current building: the balance block (four resources,
      live, capacity and rate), then "next entries" ruled with exact countdowns; thumb index at the
      bottom on phones, at the fore edge on desktop.
      FORM: the family ledger, my top-ranked grounded candidate (model pick), seed 156bc712.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
