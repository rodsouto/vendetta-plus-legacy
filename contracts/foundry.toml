[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The differential scenarios replay thousands of transactions inside one test.
gas_limit = "18446744073709551615"
memory_limit = 1073741824
# Foundry tests read the spec data generated by packages/spec-data (pnpm codegen).
fs_permissions = [
    { access = "read", path = "../packages/spec-data/generated" },
    { access = "read", path = "../packages/rules/generated" },
]

[fmt]
line_length = 100
ignore = ["src/generated/*.sol"]
